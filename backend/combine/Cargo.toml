[package]
name = "pa-combine"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
futures-util = "0.3"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp", "gif"] }
lz4_flex = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.26"
zstd = "0.13"

[profile.profiling]
inherits = "release"
debug = true