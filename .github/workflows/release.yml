name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install project tools
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          path: .
          token: ${{ github.token }}

      - name: format sources
        shell: bash
        run: |
          set -euo pipefail

          for manifest in backend/combine/Cargo.toml backend/sync/Cargo.toml; do
            cargo fmt --manifest-path "$manifest"
          done

          mapfile -t luau_files < <(find combine district_mapper hole_cutter pa_tools sync_plugin world_selector -type f \( -name '*.lua' -o -name '*.luau' \) | sort)

          if [[ ${#luau_files[@]} -eq 0 ]]; then
            echo "no plugin source files found"
            exit 1
          fi

          stylua "${luau_files[@]}"

          definitions_file="$(mktemp)"
          trap 'rm -f "$definitions_file"' EXIT

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.PluginSecurity.d.luau \
            --output "$definitions_file"

          luau-lsp analyze \
            --platform roblox \
            --definitions="roblox=$definitions_file" \
            "${luau_files[@]}"

      - name: build rust executables
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/release
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"

          cargo build --release --locked --manifest-path backend/combine/Cargo.toml
          cargo build --release --locked --manifest-path backend/sync/Cargo.toml

          cp target/release/pa-combine.exe dist/release/
          cp target/release/sync_backend.exe dist/release/

      - name: stage plugin source files
        shell: pwsh
        run: |
          $sourceFiles = @{
            "paTools.lua" = "pa_tools/paTools.lua"
            "PASync.lua" = "sync_plugin/PASync.lua"
            "combinePlugin.lua" = "combine/combinePlugin.lua"
            "districtMapper.lua" = "district_mapper/districtMapper.lua"
            "holeCutter.lua" = "hole_cutter/holeCutter.lua"
            "worldSelector.lua" = "world_selector/worldSelector.lua"
          }

          foreach ($entry in $sourceFiles.GetEnumerator()) {
            if (-not (Test-Path $entry.Value -PathType Leaf)) {
              throw "missing release source file: $($entry.Value)"
            }

            Copy-Item $entry.Value (Join-Path "dist/release" $entry.Key)
          }

      - name: prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tags must use semantic versioning, for example v1.2.3"
            exit 1
          fi

          notes_file=".github/releases/${GITHUB_REF_NAME}.md"

          if [[ ! -f "$notes_file" ]]; then
            echo "missing release notes: $notes_file"
            echo "create the release notes from RELEASE_TEMPLATE.md before pushing the tag"
            exit 1
          fi

          sed "s|TAG|${GITHUB_REF_NAME}|g" "$notes_file" > "$RUNNER_TEMP/release-notes.md"

      - name: publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/release/pa-combine.exe
            dist/release/sync_backend.exe
            dist/release/paTools.lua
            dist/release/PASync.lua
            dist/release/combinePlugin.lua
            dist/release/districtMapper.lua
            dist/release/holeCutter.lua
            dist/release/worldSelector.lua
