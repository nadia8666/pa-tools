name: release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install project tools
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          path: .
          token: ${{ github.token }}

      - name: format and validate sources
        shell: bash
        run: |
          set -euo pipefail

          manifests=(
            backend/combine/Cargo.toml
            backend/sync/Cargo.toml
          )

          for manifest in "${manifests[@]}"; do
            cargo fmt --manifest-path "$manifest"
          done

          mapfile -t luau_files < <(find . -type f \( -name '*.lua' -o -name '*.luau' \) -not -path './target/*' | sort)

          if [[ ${#luau_files[@]} -eq 0 ]]; then
            echo "no Luau files found"
            exit 1
          fi

          stylua "${luau_files[@]}"
          luau-lsp analyze --platform roblox "${luau_files[@]}"

      - name: build rust executables
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/windows
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"

          cargo build --release --locked --manifest-path backend/combine/Cargo.toml
          cargo build --release --locked --manifest-path backend/sync/Cargo.toml

          cp target/release/pa-combine.exe dist/windows/
          cp target/release/sync_backend.exe dist/windows/

      - name: checkout luau compiler
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: luau-src

      - name: build luau compiler
        shell: bash
        run: |
          set -euo pipefail

          cmake -S luau-src -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --config Release --target Luau.Compile.CLI --parallel

      - name: compile plugin bytecode
        shell: bash
        run: |
          set -euo pipefail

          compiler="luau-build/Release/luau-compile.exe"
          test -f "$compiler"

          mapfile -t luau_files < <(find . -type f -name '*.lua' -not -path './target/*' -not -path './luau-src/*' | sort)

          for source in "${luau_files[@]}"; do
            output="dist/plugins/${source%.lua}.luac"
            mkdir -p "$(dirname "$output")"
            "$compiler" binary "$source" > "$output"
          done

      - name: publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/windows/*.exe
            dist/plugins/**/*.luac
