name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install project tools
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          path: .
          token: ${{ github.token }}

      - name: build rust projects
        shell: bash
        run: |
          set -euo pipefail

          for manifest in backend/combine/Cargo.toml backend/sync/Cargo.toml; do
            cargo build --locked --manifest-path "$manifest"
          done

      - name: check luau formatting and types
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t luau_files < <(find . -type f \( -name '*.lua' -o -name '*.luau' \) -not -path './target/*' | sort)

          if [[ ${#luau_files[@]} -eq 0 ]]; then
            echo "no Luau files found"
            exit 1
          fi

          stylua --check "${luau_files[@]}"

          definitions_file="$(mktemp)"
          trap 'rm -f "$definitions_file"' EXIT

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.PluginSecurity.d.luau \
            --output "$definitions_file"

          luau-lsp analyze \
            --platform roblox \
            --definitions="roblox=$definitions_file" \
            "${luau_files[@]}"
